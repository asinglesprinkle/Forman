[project]
name = "foreman"
version = "0.1.0"
description = "Two-phase agent pipeline: prose to Linear tickets, then autonomous ticket execution."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "claude-agent-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
foreman = "foreman.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foreman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
